[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysh"
version = "0.1.0"
description = "A simple Unix shell written in Python (Build Your Own X)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

# After `pip install -e .`, the `pysh` command is available in the terminal.
[project.scripts]
pysh = "pysh.cli:main"

[tool.setuptools]
packages = ["pysh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
